server:
  port: 8080

spring:
  datasource:
    url: jdbc:postgresql://localhost:5433/ecommerce
    username: ecommerce
    password: ecommerce
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

app:
  jwt:
    secret: change-me-please-very-secret-key
    expiration: 86400000